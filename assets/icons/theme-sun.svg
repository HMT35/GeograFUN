<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Light silver background -->
  <rect width="192" height="192" rx="32" fill="#e8ecf1"/>
  
  <!-- Sun rays -->
  <g stroke="#f9a825" stroke-width="5" stroke-linecap="round">
    <line x1="96" y1="28" x2="96" y2="44"/>
    <line x1="96" y1="148" x2="96" y2="164"/>
    <line x1="28" y1="96" x2="44" y2="96"/>
    <line x1="148" y1="96" x2="164" y2="96"/>
    <line x1="48" y1="48" x2="59" y2="59"/>
    <line x1="133" y1="133" x2="144" y2="144"/>
    <line x1="144" y1="48" x2="133" y2="59"/>
    <line x1="59" y1="133" x2="48" y2="144"/>
  </g>
  
  <!-- Sun core circle -->
  <circle cx="96" cy="96" r="38" fill="#f9a825"/>
  
  <!-- Sun inner highlight -->
  <circle cx="96" cy="96" r="28" fill="#ffcc02"/>
  
  <!-- Subtle glow -->
  <circle cx="96" cy="96" r="44" fill="none" stroke="#f9a825" stroke-width="2" opacity="0.4"/>
</svg>